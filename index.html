<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACK OPS FPS</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #000;
            overflow: hidden; touch-action: none;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD Táctico estilo Call of Duty */
        #hud {
            position: fixed; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        #radar {
            width: 95px; height: 95px; border-radius: 50%;
            background: rgba(5, 15, 25, 0.8);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }
        .stats-derecha {
            display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
        }
        .caja-hud {
            background: rgba(10, 15, 25, 0.8);
            border-left: 3px solid #00f3ff;
            padding: 6px 12px; color: #fff; font-weight: bold; font-size: 14px;
        }
        #barra-salud-fondo {
            width: 130px; height: 10px; background: rgba(255,255,255,0.2); margin-top: 4px;
        }
        #barra-salud {
            width: 100%; height: 100%; background: #00ff88; transition: width 0.15s;
        }
        #municion-txt { color: #ffaa00; font-size: 18px; }

        /* Controles Táctiles FPS */
        #zona-joystick {
            position: fixed; bottom: 25px; left: 25px;
            width: 120px; height: 120px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 243, 255, 0.4);
            z-index: 20;
        }
        #palanca {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 12px #00f3ff;
        }
        #zona-camara {
            position: fixed; top: 0; right: 0; width: 55vw; height: 100vh;
            z-index: 15;
        }
        .botones-accion {
            position: fixed; bottom: 25px; right: 20px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
            z-index: 25;
        }
        .fila-botones { display: flex; gap: 12px; align-items: center; }
        .btn-fps {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #00f3ff; color: #00f3ff;
            font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-fps:active { background: #00f3ff; color: #000; }
        #btnDisparar {
            width: 82px; height: 82px; border-radius: 50%;
            background: rgba(255, 0, 85, 0.35);
            border: 3px solid #ff0055; color: #fff;
            font-size: 14px; font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            display: flex; align-items: center; justify-content: center;
        }
        #btnDisparar:active { background: rgba(255, 0, 85, 0.8); transform: scale(0.93); }

        /* Pantallas */
        .pantalla-overlay {
            position: fixed; inset: 0; background: rgba(5, 8, 15, 0.94);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 50; padding: 20px; color: #fff;
        }
        h1 { font-size: 32px; color: #00f3ff; margin: 0 0 8px; letter-spacing: 2px; text-shadow: 0 0 15px #00f3ff; }
        .sub { color: #ffaa00; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        p { color: #cbd5e1; font-size: 15px; max-width: 310px; line-height: 1.5; margin-bottom: 25px; }
        .btn-start {
            padding: 16px 40px; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #ffaa00, #ff0055);
            border: none; border-radius: 8px; color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }
        #dano-flash {
            position: fixed; inset: 0; background: rgba(255, 0, 0, 0.35);
            pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 12;
        }
    </style>
</head>
<body>

    <div id="dano-flash"></div>

    <div id="hud">
        <canvas id="radar" width="95" height="95"></canvas>
        <div class="stats-derecha">
            <div class="caja-hud">BAJAS: <span id="bajas-txt" style="color:#00f3ff;">0</span> | OLEADA: <span id="oleada-txt" style="color:#ffaa00;">1</span></div>
            <div class="caja-hud">
                SALUD
                <div id="barra-salud-fondo"><div id="barra-salud"></div></div>
            </div>
            <div class="caja-hud">BALAS: <span id="municion-txt">30 / ∞</span></div>
        </div>
    </div>

    <div id="zona-joystick"><div id="palanca"></div></div>
    <div id="zona-camara"></div>

    <div class="botones-accion">
        <div class="fila-botones">
            <div class="btn-fps" id="btnMira">MIRA</div>
            <div class="btn-fps" id="btnRecargar">RECARGA</div>
        </div>
        <div id="btnDisparar">FUEGO</div>
    </div>

    <div id="menuInicio" class="pantalla-overlay">
        <div class="sub">OPERACIÓN TÁCTICA FPS</div>
        <h1>BLACK OPS 3D</h1>
        <p><b>Izquierda:</b> Usa el joystick para moverte.<br><b>Derecha:</b> Desliza para apuntar y toca FUEGO para disparar.</p>
        <button class="btn-start" id="btnIniciarReal">ENTRAR AL COMBATE</button>
    </div>

    <div id="menuOver" class="pantalla-overlay" style="display:none;">
        <h1 style="color:#ff0055; text-shadow:0 0 15px #ff0055;">SOLDADO ABATIDO</h1>
        <p id="statsFinales">Bajas confirmadas: 0</p>
        <button class="btn-start" id="btnReintentarReal">VOLVER A DESPLEGAR</button>
    </div>

        let jugando = false;

        // Audio Sintetizado Seguro
        let audioCtx = null;
        function sonido(tipo) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const t = audioCtx.currentTime;

                if (tipo === "tiro") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(320, t);
                    osc.frequency.exponentialRampToValueAtTime(55, t + 0.08);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                    osc.start(t); osc.stop(t + 0.08);
                } else if (tipo === "hit") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(900, t);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                    osc.start(t); osc.stop(t + 0.05);
                } else if (tipo === "recarga") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(220, t);
                    osc.frequency.setValueAtTime(440, t + 0.12);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                    osc.start(t); osc.stop(t + 0.25);
                }
            } catch (err) {}
        }
