<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05080f">
    <title>BLACK OPS 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #05080f;
            overflow: hidden; touch-action: none;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        #hud {
            position: fixed; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        #radar {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(5, 15, 25, 0.85);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }
        .stats-derecha { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .caja-hud {
            background: rgba(10, 15, 25, 0.85);
            border-left: 3px solid #00f3ff;
            padding: 6px 12px; color: #fff; font-weight: bold; font-size: 13px;
        }
        #barra-salud-fondo { width: 120px; height: 10px; background: rgba(255,255,255,0.2); margin-top: 4px; }
        #barra-salud { width: 100%; height: 100%; background: #00ff88; transition: width 0.15s; }
        #municion-txt { color: #ffaa00; font-size: 16px; }

        #zona-joystick {
            position: fixed; bottom: 25px; left: 25px;
            width: 115px; height: 115px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 243, 255, 0.4);
            z-index: 20;
        }
        #palanca {
            position: absolute; top: 32px; left: 32px;
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(0, 243, 255, 0.65);
            box-shadow: 0 0 12px #00f3ff;
        }
        #zona-camara { position: fixed; top: 0; right: 0; width: 55vw; height: 100vh; z-index: 15; }
        .botones-accion {
            position: fixed; bottom: 25px; right: 20px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
            z-index: 25;
        }
        .fila-botones { display: flex; gap: 12px; align-items: center; }
        .btn-fps {
            width: 58px; height: 58px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #00f3ff; color: #00f3ff;
            font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        #btnDisparar {
            width: 82px; height: 82px; border-radius: 50%;
            background: rgba(255, 0, 85, 0.4);
            border: 3px solid #ff0055; color: #fff;
            font-size: 14px; font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .pantalla-overlay {
            position: fixed; inset: 0; background: rgba(5, 8, 15, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 50; padding: 20px; color: #fff;
        }
        h1 { font-size: 32px; color: #00f3ff; margin: 0 0 8px; letter-spacing: 2px; }
        p { color: #cbd5e1; font-size: 15px; max-width: 300px; line-height: 1.5; margin-bottom: 25px; }
        .btn-start {
            padding: 18px 42px; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #ffaa00, #ff0055);
            border: none; border-radius: 10px; color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            cursor: pointer;
        }
        #dano-flash {
            position: fixed; inset: 0; background: rgba(255, 0, 0, 0.35);
            pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 12;
        }
    </style>
</head>
<body>

    <div id="dano-flash"></div>

    <div id="hud">
        <canvas id="radar" width="90" height="90"></canvas>
        <div class="stats-derecha">
            <div class="caja-hud">BAJAS: <span id="bajas-txt" style="color:#00f3ff;">0</span> | OLEADA: <span id="oleada-txt" style="color:#ffaa00;">1</span></div>
            <div class="caja-hud">
                SALUD
                <div id="barra-salud-fondo"><div id="barra-salud"></div></div>
            </div>
            <div class="caja-hud">BALAS: <span id="municion-txt">30 / ∞</span></div>
        </div>
    </div>

    <div id="zona-joystick"><div id="palanca"></div></div>
    <div id="zona-camara"></div>

    <div class="botones-accion">
        <div class="fila-botones">
            <div class="btn-fps" id="btnMira">MIRA</div>
            <div class="btn-fps" id="btnRecargar">RECARGA</div>
        </div>
        <div id="btnDisparar">FUEGO</div>
    </div>

    <div id="menuInicio" class="pantalla-overlay">
        <div style="color:#ffaa00; font-weight:bold; font-size:13px; margin-bottom:8px;">OPERACIÓN TÁCTICA FPS</div>
        <h1>BLACK OPS 3D</h1>
        <p><b>Izquierda:</b> Joystick para caminar.<br><b>Derecha:</b> Desliza para apuntar y toca FUEGO.</p>
        <button class="btn-start" id="btnStart1">ENTRAR AL COMBATE</button>
    </div>

    <div id="menuOver" class="pantalla-overlay" style="display:none;">
        <h1 style="color:#ff0055;">SOLDADO ABATIDO</h1>
        <p id="statsFinales">Bajas confirmadas: 0</p>
        <button class="btn-start" id="btnStart2">VOLVER A DESPLEGAR</button>
    </div>

    <canvas id="pantalla3D"></canvas>

    <script>
        const canvas = document.getElementById("pantalla3D");
        const ctx = canvas.getContext("2d");
        const radarCanvas = document.getElementById("radar");
        const rCtx = radarCanvas.getContext("2d");

        let W = canvas.width = window.innerWidth;
        let H = canvas.height = window.innerHeight;
        window.addEventListener("resize", () => {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        });

        // Mapa construido con texto plano para evitar cualquier error de formato
        const PLANO_MAPA = [
            "111111111111",
            "100000000001",
            "100220022001",
            "100200002001",
            "100000000001",
            "102001100201",
            "102001100201",
            "100000000001",
            "100200002001",
            "100220022001",
            "100000000001",
            "111111111111"
        ];

        function obtenerCelda(x, y) {
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            if (iy < 0 || iy >= PLANO_MAPA.length || ix < 0 || ix >= PLANO_MAPA[0].length) {
                return 1;
            }
            return parseInt(PLANO_MAPA[iy].charAt(ix), 10);
        }

        let jugando = false;
        let jugador = { x: 2.5, y: 1.5, dir: 0.8, salud: 100, balas: 30, recargando: false, zoom: false };
        let enemigos = [];
        let bajas = 0, oleada = 1, retrocesoArma = 0, destelloDisparo = 0, pasoAnim = 0;
        let joyX = 0, joyY = 0, disparando = false, ultimoDisparo = 0, ultimoFrame = 0;

        let audioCtx = null;
        function sonido(tipo) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const t = audioCtx.currentTime;
                if (tipo === "tiro") {
                    osc.type = "sawtooth"; osc.frequency.setValueAtTime(300, t);
                    osc.frequency.exponentialRampToValueAtTime(50, t + 0.08);
                    gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                    osc.start(t); osc.stop(t + 0.08);
                } else if (tipo === "hit") {
                    osc.type = "sine"; osc.frequency.setValueAtTime(850, t);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                    osc.start(t); osc.stop(t + 0.05);
                }
            } catch (err) {}
        }

        // Joystick
        const zonaJoy = document.getElementById("zona-joystick");
        const palanca = document.getElementById("palanca");
        let joyTouchId = null;

        zonaJoy.addEventListener("touchstart", (e) => {
            e.preventDefault();
            joyTouchId = e.changedTouches[0].identifier;
            moverJoystick(e.changedTouches[0]);
        }, { passive: false });

        zonaJoy.addEventListener("touchmove", (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) moverJoystick(e.changedTouches[i]);
            }
        }, { passive: false });

        const soltarJoy = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null; joyX = 0; joyY = 0;
                    palanca.style.transform = "translate(0px, 0px)";
                }
            }
        };
        zonaJoy.addEventListener("touchend", soltarJoy);
        zonaJoy.addEventListener("touchcancel", soltarJoy);

        function moverJoystick(touch) {
            const rect = zonaJoy.getBoundingClientRect();
