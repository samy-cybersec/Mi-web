<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER STRIKE 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0; background: #04060c;
            overflow: hidden; touch-action: none;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD Superior */
        #hud {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .panel-hud {
            background: rgba(10, 18, 35, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.4);
            padding: 8px 14px; border-radius: 10px;
            color: #00f3ff; font-weight: bold; font-size: 16px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        #vida-box {
            width: 120px; height: 12px; background: rgba(255, 255, 255, 0.15);
            border-radius: 6px; overflow: hidden; margin-top: 4px;
        }
        #vida-bar {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #00ff88, #00f3ff);
            transition: width 0.15s ease-out;
        }

        /* Controles Táctiles */
        #controles {
            position: fixed; bottom: 22px; left: 18px; right: 18px;
            display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 20; pointer-events: none;
        }
        .grupo-botones { display: flex; gap: 14px; pointer-events: auto; align-items: center; }
        .btn {
            width: 66px; height: 66px; border-radius: 50%;
            background: rgba(0, 243, 255, 0.14);
            border: 2px solid #00f3ff; color: #00f3ff;
            font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
        }
        .btn.presionado { background: rgba(0, 243, 255, 0.5); transform: scale(0.92); }
        #btnSalto {
            width: 56px; height: 56px; font-size: 12px;
            border-color: #00ff88; color: #00ff88;
            background: rgba(0, 255, 136, 0.14);
        }
        #btnSalto.presionado { background: rgba(0, 255, 136, 0.5); }
        #btnFuego {
            width: 80px; height: 80px; font-size: 15px;
            border-color: #ff007f; color: #ff007f;
            background: rgba(255, 0, 127, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }
        #btnFuego.presionado { background: rgba(255, 0, 127, 0.6); transform: scale(0.92); }

        /* Pantallas de Inicio y Game Over */
        .pantalla {
            position: fixed; inset: 0; background: rgba(4, 6, 12, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 30; padding: 20px;
        }
        h1 {
            font-size: 34px; margin: 0 0 10px; color: #00f3ff;
            text-shadow: 0 0 18px #00f3ff; letter-spacing: 2px;
        }
        p { color: #cbd5e1; font-size: 16px; max-width: 300px; line-height: 1.5; margin-bottom: 25px; }
        .btn-jugar {
            padding: 15px 38px; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #00f3ff, #00ff88);
            border: none; border-radius: 30px; color: #04060c;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="panel-hud">
            <div>SALUD</div>
            <div id="vida-box"><div id="vida-bar"></div></div>
        </div>
        <div class="panel-hud" style="text-align: right;">
            <div>PUNTOS: <span id="txtPuntos">0</span></div>
            <div style="font-size: 12px; color: #00ff88;">RÉCORD: <span id="txtRecord">0</span></div>
        </div>
    </div>

    <div id="controles">
        <div class="grupo-botones">
            <div class="btn" id="btnIzq">◀</div>
            <div class="btn" id="btnDer">▶</div>
        </div>
        <div class="grupo-botones">
            <div class="btn" id="btnSalto">SALTO</div>
            <div class="btn" id="btnFuego">FUEGO</div>
        </div>
    </div>

    <!-- Pantalla de Inicio -->
    <div id="pantallaInicio" class="pantalla">
        <h1>CYBER STRIKE 3D</h1>
        <p>Elimina a los drones enemigos antes de que crucen tu línea defensiva. Usa los botones inferiores para moverte, saltar y disparar.</p>
        <button class="btn-jugar" onclick="comenzarJuego()">INICIAR MISIÓN</button>
    </div>

    <!-- Pantalla Game Over -->
    <div id="pantallaOver" class="pantalla" style="display: none;">
        <h1 style="color: #ff007f; text-shadow: 0 0 18px #ff007f;">MISIÓN FALLIDA</h1>
        <p id="resumenPuntos">Puntuación final: 0</p>
        <button class="btn-jugar" onclick="comenzarJuego()">REINTENTAR</button>
    </div>

    <canvas id="lienzo"></canvas>

    <script>
        const canvas = document.getElementById("lienzo");
        const ctx = canvas.getContext("2d");

        let W, H, horizonteY, fov;
        function ajustarPantalla() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            horizonteY = H * 0.36;
            fov = W * 0.85;
        }
        window.addEventListener("resize", ajustarPantalla);
        ajustarPantalla();

        // Sintetizador de Audio Web (Sin archivos externos)
        let audioCtx = null;
        function tocarSonido(tipo) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const ahora = audioCtx.currentTime;

                if (tipo === "disparo") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(650, ahora);
                    osc.frequency.exponentialRampToValueAtTime(110, ahora + 0.09);
                    gain.gain.setValueAtTime(0.08, ahora);
                    gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.09);
                    osc.start(ahora); osc.stop(ahora + 0.09);
                } else if (tipo === "explosion") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(140, ahora);
                    osc.frequency.exponentialRampToValueAtTime(30, ahora + 0.22);
                    gain.gain.setValueAtTime(0.14, ahora);
                    gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.22);
                    osc.start(ahora); osc.stop(ahora + 0.22);
                } else if (tipo === "dano") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(90, ahora);
                    osc.frequency.linearRampToValueAtTime(45, ahora + 0.25);
                    gain.gain.setValueAtTime(0.2, ahora);
                    gain.gain.linearRampToValueAtTime(0.001, ahora + 0.25);
                    osc.start(ahora); osc.stop(ahora + 0.25);
                }
            } catch (e) {}
        }

        // Proyección 3D -> 2D
        function proyectar(x, y, z) {
            const escala = fov / (fov + z);
            const sx = W / 2 + x * escala;
            const sy = horizonteY + (y + 160) * escala;
            return { x: sx, y: sy, escala };
        }

        // Variables de estado
        let activo = false;
        let puntos = 0;
        let record = localStorage.getItem("cyberStrike3DRecord") || 0;
        document.getElementById("txtRecord").innerText = record;

        let jugador = { x: 0, y: 0, vy: 0, enSuelo: true, retroceso: 0, paso: 0 };
        let balas = [];
        let enemigos = [];
        let particulas = [];
        let estrellas = [];
        let gridOffset = 0;
        let ultimoTiempo = 0;
        let tiempoSpawn = 0;
        let tiempoDisparo = 0;

        // Controles
        const estadoBotones = { izq: false, der: false, fuego: false };
        function enlazarBoton(id, clave) {
            const el = document.getElementById(id);
            el.addEventListener("touchstart", (e) => {
                e.preventDefault();
                estadoBotones[clave] = true;
                el.classList.add("presionado");
            });
            el.addEventListener("touchend", (e) => {
                e.preventDefault();
                estadoBotones[clave] = false;
                el.classList.remove("presionado");
            });
        }
        enlazarBoton("btnIzq", "izq");
        enlazarBoton("btnDer", "der");
        enlazarBoton("btnFuego", "fuego");

        document.getElementById("btnSalto").addEventListener("touchstart", (e) => {
            e.preventDefault();
            const el = document.getElementById("btnSalto");
            el.classList.add("presionado");
            if (activo && jugador.enSuelo) {
                jugador.vy = -480;
                jugador.enSuelo = false;
            }
        });
        document.getElementById("btnSalto").addEventListener("touchend", (e) => {
            e.preventDefault();
            document.getElementById("btnSalto").classList.remove("presionado");
        });

        // Inicializar estrellas de fondo
        for (let i = 0; i < 45; i++) {
            estrellas.push({
                x: Math.random() * 2000 - 1000,
                y: Math.random() * 350 - 380,
                r: Math.random() * 1.8 + 0.5
            });
        }
