<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Soldier 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05070d; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            color: #00f3ff; font-size: 18px; font-weight: bold;
            text-shadow: 0 0 8px #00f3ff; pointer-events: none; z-index: 10;
        }
        #barraVidaCont {
            width: 120px; height: 14px; background: rgba(255,255,255,0.15);
            border: 1px solid #00f3ff; border-radius: 7px; overflow: hidden;
        }
        #barraVida { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00f3ff); transition: width 0.2s; }
        #controles {
            position: absolute; bottom: 20px; left: 18px; right: 18px;
            display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 15; pointer-events: none;
        }
        .grupo-izq, .grupo-der { display: flex; gap: 12px; pointer-events: auto; align-items: center; }
        .btn {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(0, 243, 255, 0.15);
            border: 2px solid #00f3ff; color: #00f3ff;
            font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(4px);
        }
        .btn:active { background: rgba(0, 243, 255, 0.5); transform: scale(0.93); }
        #btnSaltar {
            width: 56px; height: 56px; font-size: 13px;
            border-color: #00ff88; color: #00ff88;
            background: rgba(0, 255, 136, 0.15);
        }
        #btnFuego {
            width: 78px; height: 78px; font-size: 15px;
            background: rgba(255, 0, 127, 0.25);
            border: 2px solid #ff007f; color: #ff007f;
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.5);
        }
        #btnFuego:active { background: rgba(255, 0, 127, 0.65); transform: scale(0.93); }
        #gameover {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: #ff007f; text-align: center; z-index: 25;
        }
        h1 { font-size: 32px; margin: 0 0 10px; text-shadow: 0 0 15px #ff007f; }
        p { color: #fff; font-size: 18px; margin-bottom: 25px; }
        #btnReiniciar {
            padding: 14px 32px; font-size: 17px; font-weight: bold;
            background: linear-gradient(90deg, #00f3ff, #00ff88);
            border: none; border-radius: 30px; color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="hud">
        <div>BAJAS: <span id="puntos">0</span></div>
        <div id="barraVidaCont"><div id="barraVida"></div></div>
    </div>

    <div id="controles">
        <div class="grupo-izq">
            <div class="btn" id="btnIzq">◀</div>
            <div class="btn" id="btnDer">▶</div>
        </div>
        <div class="grupo-der">
            <div class="btn" id="btnSaltar">SALTO</div>
            <div class="btn" id="btnFuego">FUEGO</div>
        </div>
    </div>

    <div id="gameover">
        <h1>SOLDADO CAÍDO</h1>
        <p id="finalPuntos">Enemigos eliminados: 0</p>
        <button id="btnReiniciar" onclick="reiniciar()">REAPARECER</button>
    </div>

    <script>
        let scene, camera, renderer, soldado, piernaIzq, piernaDer, brazoArma, fogonazo, grid;
        let balas = [], enemigos = [], particulas = [];
        let puntos = 0, vida = 100, frame = 0, activo = true;
        let movIzq = false, movDer = false, disparando = false, ultimoDisparo = 0;
        let velY = 0, enSuelo = true;

        const txtPuntos = document.getElementById("puntos");
        const barraVida = document.getElementById("barraVida");
        const screenOver = document.getElementById("gameover");
        const txtFinal = document.getElementById("finalPuntos");

        function crearSoldado() {
            const grupo = new THREE.Group();

            const matArmadura = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.7 });
            const matNeon = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const matArma = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.2 });

            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.95, 0.42), matArmadura);
            torso.position.y = 1.25;
            grupo.add(torso);

            // Detalle neón en espalda
            const mochila = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.6, 0.15), matNeon);
            mochila.position.set(0, 1.3, 0.25);
            grupo.add(mochila);

            // Cabeza y Visor
            const cabeza = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.46), matArmadura);
            cabeza.position.y = 2.02;
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.14, 0.1), matNeon);
            visor.position.set(0, 2.04, -0.2);
            grupo.add(cabeza, visor);

            // Piernas articuladas
            piernaIzq = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.78, 0.28), matArmadura);
            piernaIzq.position.set(-0.2, 0.4, 0);
            piernaDer = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.78, 0.28), matArmadura);
            piernaDer.position.set(0.2, 0.4, 0);
            grupo.add(piernaIzq, piernaDer);

            // Brazo izquierdo
            const brazoIzq = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.65, 0.2), matArmadura);
            brazoIzq.position.set(-0.5, 1.35, -0.15);
            brazoIzq.rotation.x = 0.6;
            grupo.add(brazoIzq);

            // Brazo derecho + Rifle de asalto
            brazoArma = new THREE.Group();
            brazoArma.position.set(0.5, 1.45, 0);

            const brazoDer = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.2), matArmadura);
            brazoDer.position.set(0, -0.1, -0.25);
            brazoDer.rotation.x = Math.PI / 2;

            const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 1.1), matArma);
            rifle.position.set(0, -0.05, -0.65);

            const miraLaser = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.9), matNeon);
            miraLaser.position.set(0, 0.07, -0.65);

            // Destello del disparo
            fogonazo = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
            fogonazo.position.set(0, -0.05, -1.25);
            fogonazo.visible = false;

            brazoArma.add(brazoDer, rifle, miraLaser, fogonazo);
            grupo.add(brazoArma);

            return grupo;
        }

        function crearEnemigo3D() {
            const grupo = new THREE.Group();
            const matCuerpo = new THREE.MeshStandardMaterial({ color: 0x2a0818, metalness: 0.6, roughness: 0.3 });
            const matOjo = new THREE.MeshBasicMaterial({ color: 0xff007f });

            const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.1, 0.5), matCuerpo);
            cuerpo.position.y = 1.1;
            const cabeza = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.5), matCuerpo);
            cabeza.position.y = 1.95;
            const ojo = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.14, 0.1), matOjo);
            ojo.position.set(0, 1.95, 0.24);

            grupo.add(cuerpo, cabeza, ojo);
            return grupo;
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05070d, 0.032);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3.6, 7.2);
            camera.lookAt(0, 1.2, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x05070d);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const luz = new THREE.DirectionalLight(0x00f3ff, 1.3);
            luz.position.set(4, 12, 8);
            scene.add(luz);

            grid = new THREE.GridHelper(60, 40, 0x00f3ff, 0x162038);
            scene.add(grid);

            soldado = crearSoldado();
            soldado.position.set(0, 0, 3.2);
            scene.add(soldado);

            configurarBotones();

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animar();
        }

        function configurarBotones() {
            const bIzq = document.getElementById("btnIzq");
            const bDer = document.getElementById("btnDer");
            const bSaltar = document.getElementById("btnSaltar");
            const bFuego = document.getElementById("btnFuego");

            bIzq.addEventListener("touchstart", (e) => { e.preventDefault(); movIzq = true; });
            bIzq.addEventListener("touchend", () => movIzq = false);

            bDer.addEventListener("touchstart", (e) => { e.preventDefault(); movDer = true; });
            bDer.addEventListener("touchend", () => movDer = false);

            bSaltar.addEventListener("touchstart", (e) => {
                e.preventDefault();
